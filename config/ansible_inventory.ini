# Ansible Inventory for SAP S/4HANA Monitoring Platform
# Auto-generated from landscape.json
# This inventory defines all SAP hosts for Ansible-based monitoring

# Local Test System
[local_test]
localhost ansible_connection=ssh ansible_user=arajvans

# Production System (PRD)
[prd_app_servers]
ascs01.prd.local
pas01.prd.local
aas01.prd.local
aas02.prd.local

[prd_db_servers]
hana01.prd.local
hana02.prd.local

# Quality Assurance System (QAS)
[qas_app_servers]
ascs01.qas.local
pas01.qas.local

[qas_db_servers]
hana01.qas.local

# Development System (DEV)
[dev_app_servers]
ascs01.dev.local
pas01.dev.local

[dev_db_servers]
hana01.dev.local

# Sandbox System (SBX)
[sbx_app_servers]
ascs01.sbx.local
pas01.sbx.local

[sbx_db_servers]
hana01.sbx.local

# Aggregate groups
[sap_app_servers:children]
local_test
prd_app_servers
qas_app_servers
dev_app_servers
sbx_app_servers

[sap_db_servers:children]
prd_db_servers
qas_db_servers
dev_db_servers
sbx_db_servers

[sap_all_servers:children]
sap_app_servers
sap_db_servers

# Global variables for all SAP hosts
[sap_all_servers:vars]
ansible_user=sidadm
# SSH connection multiplexing for better performance
ansible_ssh_common_args=-o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
# Connection timeout
ansible_timeout=30
# Python interpreter (adjust if needed)
ansible_python_interpreter=/usr/bin/python3
