# Ansible Configuration for SAP S/4HANA Monitoring Platform
# NOTE: Inventory is dynamically generated from landscape.json by ansible_executor.py
[defaults]

# Disable host key checking for easier automation (adjust for production security)
host_key_checking = False

# Connection settings
timeout = 30
forks = 10

# SSH connection optimization
transport = ssh
pipelining = True

# Reduce verbosity (0=minimal, 1=verbose, 2=more verbose, etc.)
verbosity = 0

# Retry settings
retry_files_enabled = False

# Performance tuning
gathering = explicit
fact_caching = memory
fact_caching_timeout = 3600

# Output settings
stdout_callback = yaml
callbacks_enabled = timer

[ssh_connection]
# SSH connection multiplexing for performance
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=no
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# Connection timeout
connect_timeout = 30
connect_retry_timeout = 30

[privilege_escalation]
# Privilege escalation settings (adjust as needed for SAP environments)
become = False
become_method = sudo
become_user = root
become_ask_pass = False
