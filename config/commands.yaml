# SAP Monitoring Commands Configuration
# This file defines all available monitoring commands, their parameters, and execution details
# Adding new commands here requires no code changes - they will be automatically loaded

# AGENT_COMMAND FORMATS:
# =====================
# 1. Inline command (simple):
#    agent_command: "your shell/database command here"
#    Example: agent_command: "df -h {{.path}}"
#
# 2. File-based command (for complex queries):
#    agent_command: "file:path/to/file"
#
#    Examples:
#    - Relative path: agent_command: "file:config/queries/my_query.sql"
#    - Absolute path: agent_command: "file:/usr/local/sap/queries/system_check.sql"
#
#    Notes:
#    - Relative paths are resolved from the command_loader.py directory
#    - Absolute paths are used as-is
#    - Use this for large SQL queries, complex scripts, etc.
#    - Parameter substitution ({{.param}}) works in both formats
#    - Files are loaded once at startup and cached

# HYBRID EXECUTION MODEL:
# ======================
# Backend field supports two execution modes:
#
# 1. Ansible execution (no agent deployment required):
#    backend: "ansible.shell"   - Execute shell commands via SSH
#    backend: "ansible.database" - Execute database queries via SSH
#
# 2. Go agent execution (requires agent deployment):
#    backend: "agent.shell"   - Execute via Go agent HTTP endpoint
#    backend: "agent.soap"    - Execute SOAP calls via Go agent
#    backend: "agent.rest"    - Execute REST calls via Go agent
#
# 3. Backward compatibility (defaults to Go agent):
#    backend: "shell"  - Same as "agent.shell"
#    backend: "soap"   - Same as "agent.soap"
#
# Choose Ansible for: Simple shell/SQL commands where 100-300ms latency is acceptable
# Choose Go agent for: SOAP/REST calls, streaming data, or sub-10ms response required

commands:
  # SID Discovery and Resolution Functions - Called by LLM to work with SAP System IDs
  get_available_sids:
    description: "Get list of all available SAP System IDs (SIDs) in the landscape"
    params: {}
    required: []  # No parameters needed
    agent_command: "sid_resolver_function"
    backend: "sid_resolver"
    timeout: 5

  get_all_hosts:
    description: "Get all hosts (application servers + database) for a SAP System ID"
    params: {}
    required: ["sid"]  # SID parameter required
    agent_command: "sid_resolver_function"
    backend: "sid_resolver"
    timeout: 5

  get_app_hosts:
    description: "Get only application server hosts for a SAP System ID"
    params: {}
    required: ["sid"]  # SID parameter required
    agent_command: "sid_resolver_function"
    backend: "sid_resolver"
    timeout: 5

  get_hana_hosts:
    description: "Get HANA database hosts for a SAP System ID"
    params: {}
    required: ["sid"]  # SID parameter required
    agent_command: "sid_resolver_function"
    backend: "sid_resolver"
    timeout: 5

  # Monitoring Commands - Called by LLM on specific hosts
  cpu_info:
    description: "Get current CPU usage"
    params: {}
    required: ["server"]  # Server hostname required
    allowed_host_types: "all"  # Can run on any server type
    agent_command: "top -bn1 | grep 'Cpu(s)' | head -1"
    backend: "ansible.shell"  # Use Ansible - simple shell command, no agent needed
    timeout: 30

  memory_info:
    description: "Get current memory usage"
    params: {}
    required: ["server"]  # Server hostname required
    allowed_host_types: "all"  # Can run on any server type
    agent_command: "free -h"
    backend: "ansible.shell"  # Use Ansible - simple shell command, no agent needed
    timeout: 30

  get_process_list:
    description: "Get list of running processes for a given instance"
    params:
      instance: "00"
      filter: "SAP*"
      limit: "50"
    required: ["server"]  # Only server required, instance/filter/limit will use defaults
    allowed_host_types: "app"  # Only allow on application servers
    agent_command: "execute soap call"
    backend: "agent.soap"  # Use Go agent - SOAP requires complex protocol handling
    timeout: 60

  check_database_status:
    description: "Check if SAP HANA database is up and running"
    params: {}
    required: ["server"]
    allowed_host_types: "db"  # Only allow on database hosts
    agent_command: "systemctl status SAP*HDB* || ps -ef | grep -i hdb | grep -v grep"
    backend: "ansible.shell"  # Use Ansible - simple shell command, no agent needed
    timeout: 30

  check_sap_services:
    description: "Check if SAP application services are running"
    params:
      instance: "00"
    required: ["server"]
    allowed_host_types: "app"  # Only allow on application servers
    agent_command: "sapcontrol -nr {{.instance}} -function GetProcessList"
    backend: "ansible.shell"  # Use Ansible - sapcontrol is a shell command
    timeout: 30

  hana_system_overview:
    description: "Get HANA database system overview and status"
    params:
      instance: "00"
    required: ["server", "instance"]
    allowed_host_types: "db"  # Only allow on database hosts
    agent_command: "sapcontrol -nr {{.instance}} -function GetSystemInstanceList"
    backend: "ansible.shell"  # Use Ansible - sapcontrol is a shell command
    timeout: 45

  hana_process_status:
    description: "Check HANA database process status"
    params:
      instance: "00"
    required: ["server", "instance"]
    allowed_host_types: "db"  # Only allow on database hosts
    agent_command: "sapcontrol -nr {{.instance}} -function GetProcessList"
    backend: "ansible.shell"  # Use Ansible - sapcontrol is a shell command
    timeout: 30

  hana_service_status:
    description: "Check HANA database service status via systemctl"
    params: {}
    required: ["server"]
    allowed_host_types: "db"  # Only allow on database hosts
    agent_command: "systemctl status SAP*HDB* | head -20"
    backend: "ansible.shell"  # Use Ansible - simple shell command
    timeout: 30

  disk_usage:
    description: "Get disk usage stats for a path"
    params:
      path: "/hana"
      threshold: "80"
    required: ["server", "path"]  # server and path required, threshold optional
    allowed_host_types: "all"  # Can run on any server type
    agent_command: "df -h {{.path}}"
    backend: "ansible.shell"  # Use Ansible - simple shell command
    timeout: 30

  # Example of complex database query loaded from file
  sap_performance_analysis:
    description: "Run comprehensive SAP performance analysis with blocking session detection"
    params:
      cpu_threshold: "10000"
      memory_threshold: "1048576"
      wait_threshold: "5000"
      limit: "50"
    required: ["server", "cpu_threshold", "memory_threshold"]
    agent_command: "file:config/queries/sap_performance_analysis.sql"
    backend: "ansible.database"  # Use Ansible - database queries via SSH
    timeout: 120

  # Example of complex query loaded from file
  user_session_analysis:
    description: "Analyze user sessions and detect potential issues"
    params:
      hours: "2"
      client: "100"
      min_sessions: "3"
    required: ["server", "client"]
    agent_command: "file:config/queries/user_session_analysis.sql"
    backend: "ansible.database"  # Use Ansible - database queries via SSH
    timeout: 60

  # Example of how easy it is to add new commands:
  # sap_system_status:
  #   description: "Check SAP system status"
  #   params:
  #     instance: "00"
  #     client: "100"
  #   required: ["instance"]
  #   agent_command: "sapcontrol -nr {{.instance}} -function GetSystemInstanceList"
  #   backend: "shell"
  #   timeout: 45
